<!-- Card template for a single multipage preview using Bootstrap card -->
<div class="col-sm-6 col-md-4 col-lg-3">
  <div class="card mp-card h-100">
    <img class="card-img-top mp-img" src="" alt="preview">
    <div class="card-body p-2 d-flex justify-content-between align-items-center">
      <div class="mp-label">Page</div>
      <button class="btn btn-sm btn-outline-primary mp-download">Download</button>
    </div>
  </div>
</div>
